<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>鍍膜營運管理系統 (雲端版)</title>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <!-- SheetJS (Excel 匯出套件) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --panel: #121212;
      --panel-border: #2c2c2e;
      --text: #f2f2f7;
      --subtext: #8e8e93;
      --primary: #0a84ff;
      --danger: #ff453a;
      --success: #30d158;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; padding-bottom: 80px; }
    .card { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 1.2rem; margin-top: 0; margin-bottom: 12px; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px; color: var(--primary); }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--subtext); margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; background: #1c1c1e; border: 1px solid var(--panel-border); border-radius: 8px; color: #fff; font-size: 0.95rem; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; padding: 6px 12px; width: auto; font-size: 0.8rem; }
    .btn-secondary { background: #2c2c2e; color: #fff; padding: 6px 12px; width: auto; font-size: 0.8rem; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1c1c1e; }
    .list-item:last-child { border-bottom: none; }
    .flex-row { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <!-- 1. 新增車輛施工紀錄 -->
  <div class="card">
    <h2>新增施工紀錄</h2>
    <div class="form-group">
      <label>施工日期</label>
      <input type="date" id="carDate">
    </div>
    <div class="form-group">
      <label>車牌號碼</label>
      <input type="text" id="carPlate" placeholder="例：ABC-1234">
    </div>
    <div class="form-group">
      <label>車款</label>
      <input type="text" id="carModel" placeholder="例：Model Y / CR-V">
    </div>
    <div class="form-group">
      <label>施工項目</label>
      <input type="text" id="carService" placeholder="例：全車鍍膜 / 晶亮維護">
    </div>
    <div class="form-group">
      <label>實收金額</label>
      <input type="number" id="carPrice" placeholder="0">
    </div>
    <button class="btn btn-primary" onclick="addCarRecord()">新增施工紀錄</button>
  </div>

  <!-- 2. 耗材庫存管理 -->
  <div class="card">
    <h2>耗材庫存管理</h2>
    <div class="flex-row form-group">
      <input type="text" id="supplyName" placeholder="耗材名稱 (如：藥劑A)">
      <input type="number" id="supplyQty" placeholder="數量" style="width: 100px;">
      <button class="btn btn-primary" style="width: 100px;" onclick="addSupply()">新增</button>
    </div>
    <div id="suppliesList">載入耗材資料中...</div>
  </div>

  <!-- 3. 月報表匯出與歷史紀錄 -->
  <div class="card">
    <h2>施工歷史紀錄與匯出</h2>
    <div class="flex-row form-group" style="align-items: flex-end;">
      <div style="flex: 1;">
        <label>選擇匯出月份</label>
        <input type="month" id="exportMonth">
      </div>
      <button class="btn btn-primary" style="width: auto; background: var(--success);" onclick="exportMonthlyExcel()">匯出 Excel</button>
    </div>
    <div id="carRecordsList">載入施工紀錄中...</div>
  </div>

  <script>
    // Firebase 初始化 (已包含您的設定)
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForTemplate",
      authDomain: "coating-app.firebaseapp.com",
      projectId: "coating-app",
      storageBucket: "coating-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };
    
    // 如果已有初始化好的 firebase 實例則直接使用
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    //預設管理員密碼
    const ADMIN_PASSWORD = "888";

    // 自動預設今日日期
    document.getElementById('carDate').valueAsDate = new Date();

    /** 密碼驗證工具 */
    function checkAdminPassword() {
      const input = prompt("請輸入管理員密碼：");
      if (input === null) return false;
      if (input === ADMIN_PASSWORD) return true;
      alert("密碼錯誤，權限不足！");
      return false;
    }

    /** 新增施工紀錄 */
    async function addCarRecord() {
      const date = document.getElementById('carDate').value;
      const plate = document.getElementById('carPlate').value.trim();
      const model = document.getElementById('carModel').value.trim();
      const service = document.getElementById('carService').value.trim();
      const price = Number(document.getElementById('carPrice').value || 0);

      if (!date || !plate) {
        alert('請填寫日期與車牌！');
        return;
      }

      try {
        await db.collection("orders").add({
          date, plate, model, service, price,
          timestamp: new Date(date)
        });
        alert('施工紀錄已成功新增！');
        document.getElementById('carPlate').value = '';
        document.getElementById('carModel').value = '';
        document.getElementById('carService').value = '';
        document.getElementById('carPrice').value = '';
      } catch (err) {
        alert('新增失敗：' + err.message);
      }
    }

    /** 刪除施工紀錄 (需密碼) */
    async function deleteCarRecord(id) {
      if (!checkAdminPassword()) return;
      if (!confirm("確定要刪除這筆紀錄嗎？")) return;

      try {
        await db.collection("orders").doc(id).delete();
        alert('紀錄已刪除');
      } catch (err) {
        alert('刪除失敗：' + err.message);
      }
    }

    /** 新增耗材 */
    async function addSupply() {
      const name = document.getElementById('supplyName').value.trim();
      const qty = Number(document.getElementById('supplyQty').value || 0);

      if (!name) return alert('請輸入耗材名稱');

      await db.collection("supplies").add({ name, quantity: qty });
      document.getElementById('supplyName').value = '';
      document.getElementById('supplyQty').value = '';
    }

    /** 調整耗材庫存 (需密碼) */
    async function adjustSupplyStock(id, currentName) {
      if (!checkAdminPassword()) return;
      const newQty = prompt(`請輸入 [${currentName}] 的新庫存數量：`);
      if (newQty === null || newQty.trim() === '' || isNaN(newQty)) return;

      await db.collection("supplies").doc(id).update({
        quantity: Number(newQty)
      });
      alert('庫存已更新！');
    }

    /** 前端匯出 Excel */
    async function exportMonthlyExcel() {
      const monthVal = document.getElementById('exportMonth').value;
      if (!monthVal) return alert('請選擇欲匯出的月份！');

      const [year, month] = monthVal.split('-');
      const startDate = new Date(year, month - 1, 1);
      const endDate = new Date(year, month, 0, 23, 59, 59);

      try {
        const snapshot = await db.collection("orders")
          .where("timestamp", ">=", startDate)
          .where("timestamp", "<=", endDate)
          .get();

        if (snapshot.empty) return alert('該月份無任何施工紀錄！');

        const excelData = [];
        let total = 0;

        snapshot.forEach(doc => {
          const d = doc.data();
          const p = Number(d.price || 0);
          total += p;
          excelData.push({
            "施工日期": d.date || "",
            "車牌號碼": d.plate || "",
            "車款": d.model || "",
            "施工項目": d.service || "",
            "實收金額": p
          });
        });

        // 結算列
        excelData.push({
          "施工日期": "總計",
          "車牌號碼": "",
          "車款": "",
          "施工項目": "",
          "實收金額": total
        });

        const sheet = XLSX.utils.json_to_sheet(excelData);
        const book = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(book, sheet, `${month}月報表`);
        XLSX.writeFile(book, `鍍膜營運月報表_${year}_${month}.xlsx`);
      } catch (err) {
        alert('匯出失敗：' + err.message);
      }
    }

    /** 即時監聽資料庫 - 車輛紀錄 */
    db.collection("orders").orderBy("date", "desc").onSnapshot(snapshot => {
      const container = document.getElementById('carRecordsList');
      if (snapshot.empty) {
        container.innerHTML = '<p style="color:var(--subtext);">暫無紀錄</p>';
        return;
      }
      let html = '';
      snapshot.forEach(doc => {
        const d = doc.data();
        html += `
          <div class="list-item">
            <div>
              <strong>${d.plate}</strong> (${d.model || '未填'})<br>
              <small style="color:var(--subtext);">${d.date} | ${d.service || '無項目'} | $${d.price || 0}</small>
            </div>
            <button class="btn btn-danger" onclick="deleteCarRecord('${doc.id}')">刪除</button>
          </div>
        `;
      });
      container.innerHTML = html;
    });

    /** 即時監聽資料庫 - 耗材庫存 */
    db.collection("supplies").onSnapshot(snapshot => {
      const container = document.getElementById('suppliesList');
      if (snapshot.empty) {
        container.innerHTML = '<p style="color:var(--subtext);">暫無耗材</p>';
        return;
      }
      let html = '';
      snapshot.forEach(doc => {
        const d = doc.data();
        html += `
          <div class="list-item">
            <div>
              <strong>${d.name}</strong><br>
              <small style="color:var(--subtext);">剩餘數量：${d.quantity}</small>
            </div>
            <button class="btn btn-secondary" onclick="adjustSupplyStock('${doc.id}', '${d.name}')">調整庫存</button>
          </div>
        `;
      });
      container.innerHTML = html;
    });
  </script>
</body>
</html>
